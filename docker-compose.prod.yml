# Dukaanly Production Docker Compose Configuration
#
# Turnkey production stack with reverse proxy, automated TLS (via Caddy),
# isolated private database/cache network, and zero exposed DB ports.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  proxy:
    image: caddy:2-alpine
    container_name: dukaanly_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - dukaanly_public
      - dukaanly_private

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dukaanly_frontend_prod
    restart: unless-stopped
    networks:
      - dukaanly_private

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukaanly_api_prod
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="${FORWARDED_ALLOW_IPS:-*}"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      OSRM_TIMEOUT_SECONDS: ${OSRM_TIMEOUT_SECONDS:-4.0}
      OSRM_CACHE_TTL_SECONDS: ${OSRM_CACHE_TTL_SECONDS:-300}
      OSRM_MAX_CONCURRENT_REQUESTS: ${OSRM_MAX_CONCURRENT_REQUESTS:-10}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-false}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dukaanly_private

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukaanly_worker_prod
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dukaanly_private

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukaanly_beat_prod
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dukaanly_private

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: dukaanly_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No exposed host ports: Database is strictly private on internal Docker network
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dukaanly_private

  redis:
    image: redis:7-alpine
    container_name: dukaanly_redis_prod
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save 60 1 --loglevel warning;
      else
        exec redis-server --save 60 1 --loglevel warning;
      fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # No exposed host ports: Redis is strictly private on internal Docker network
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG;
          else
            redis-cli ping | grep -q PONG;
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dukaanly_private

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: dukaanly_osrm_prod
    restart: unless-stopped
    command: >
      sh -c "if [ -f /data/bihar-latest.osrm ]; then
        exec osrm-routed --algorithm mld /data/bihar-latest.osrm;
      else
        echo 'OSRM data not found in /data. Run scripts/prepare_osrm_bihar.sh first.' && sleep 3600;
      fi"
    # No exposed host ports: OSRM is strictly private on internal Docker network
    volumes:
      - ./deploy/osrm/data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/nearest/v1/driving/85.1158,25.6144 | grep -q 'code.*Ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dukaanly_private

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  dukaanly_public:
    driver: bridge
  dukaanly_private:
    driver: bridge
    internal: false
