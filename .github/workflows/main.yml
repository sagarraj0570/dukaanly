name: Supabase & Render Keepalive

on:
  schedule:
    # Runs at 04:00 UTC (09:30 AM IST) every 3 days
    - cron: '0 4 */3 * *'
  # Allows you to manually trigger the workflow anytime from the GitHub UI
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Dukaanly PostGIS Nearby Shops Endpoint
        run: |
          echo "Sending keepalive request to Dukaanly production API..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            "https://dukaanly-api.onrender.com/api/v1/shops/nearby?latitude=25.6144&longitude=85.1158")

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully queried Supabase PostgreSQL via PostGIS. Inactivity timer reset."
            exit 0
          else
            echo "Warning: Expected HTTP 200, got $HTTP_STATUS."
            exit 1
          fi
