services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI API, WebSockets & Celery Worker)
  # -------------------------------------------------------------
  - type: web
    name: dukaanly-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: dukaanly-shared-config
      - key: DATABASE_URL
        fromDatabase:
          name: dukaanly-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dukaanly-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://dukaanly-frontend.onrender.com

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: dukaanly-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dukaanly-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: "" # Dynamically derived from VITE_API_URL via wss://

  # -------------------------------------------------------------
  # 3. Managed Key Value / Redis (Pub/Sub & Celery Transport)
  # -------------------------------------------------------------
  - type: keyvalue
    name: dukaanly-redis
    plan: free
    ipAllowList: [] # Private network only

databases:
  # -------------------------------------------------------------
  # 4. Managed PostgreSQL with PostGIS
  # -------------------------------------------------------------
  - name: dukaanly-postgres
    plan: free
    databaseName: dukaanly
    user: dukaanly_user
    postgresMajorVersion: "16"
    ipAllowList: [] # Private network only

# ---------------------------------------------------------------
# 5. Shared Environment Groups (Variables & Auto-Generated Secrets)
# ---------------------------------------------------------------
envVarGroups:
  - name: dukaanly-shared-config
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOW_MOCK_PAYMENTS
        value: "false"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_SECRET_KEY
        generateValue: true
