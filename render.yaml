services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI API, WebSockets)
  # -------------------------------------------------------------
  - type: web
    name: dukaanly-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.zoapsnksqhzswayafszx:%2Cq6g4%23iSS9%40F%40R%40@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
      - key: APP_ENV
        value: development
      - key: RUN_MIGRATIONS
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: JWT_SECRET_KEY
        value: e8b1d9c5f4a7203b8c6e1a9d4f207b5e8c1d3a7e9b204f6a1c8d5e2b7a9f0c3d
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ROUTING_PROVIDER
        value: osrm
      - key: START_CELERY_EMBEDDED
        value: "false"

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: dukaanly-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /static/*
        destination: https://dukaanly-api.onrender.com/static/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dukaanly-api.onrender.com/api/v1
