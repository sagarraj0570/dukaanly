services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: dukaanly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
    - dukaanly_net
  redis:
    image: redis:7-alpine
    container_name: dukaanly_redis
    restart: unless-stopped
    command: 'redis-server --save 60 1 --loglevel warning

      '
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - dukaanly_net
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukaanly_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
    - DATABASE_URL=postgresql+asyncpg://:@postgres:5432/
    - REDIS_URL=redis://redis:6379/0
    - SECRET_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - dukaanly_net
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
networks:
  dukaanly_net:
    driver: bridge
